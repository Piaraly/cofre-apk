name: Gerar APK release da Cofre

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter os ficheiros
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes do SDK
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Confirmar Secrets obrigatórios
        env:
          COFRE_KEYSTORE_BASE64: ${{ secrets.COFRE_KEYSTORE_BASE64 }}
          COFRE_STORE_PASSWORD: ${{ secrets.COFRE_STORE_PASSWORD }}
          COFRE_KEY_ALIAS: ${{ secrets.COFRE_KEY_ALIAS }}
          COFRE_KEY_PASSWORD: ${{ secrets.COFRE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$COFRE_KEYSTORE_BASE64" || { echo "Falta COFRE_KEYSTORE_BASE64"; exit 1; }
          test -n "$COFRE_STORE_PASSWORD" || { echo "Falta COFRE_STORE_PASSWORD"; exit 1; }
          test -n "$COFRE_KEY_ALIAS" || { echo "Falta COFRE_KEY_ALIAS"; exit 1; }
          test -n "$COFRE_KEY_PASSWORD" || { echo "Falta COFRE_KEY_PASSWORD"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Falta GOOGLE_SERVICES_JSON_BASE64"; exit 1; }

      - name: Reconstruir configuração e keystore
        env:
          COFRE_KEYSTORE_BASE64: ${{ secrets.COFRE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$COFRE_KEYSTORE_BASE64" | base64 --decode > app/cofre-release.jks
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Verificar certificado da keystore
        env:
          COFRE_STORE_PASSWORD: ${{ secrets.COFRE_STORE_PASSWORD }}
          COFRE_KEY_ALIAS: ${{ secrets.COFRE_KEY_ALIAS }}
        run: |
          ACTUAL_SHA1="$(keytool -list -v -keystore app/cofre-release.jks -storepass "$COFRE_STORE_PASSWORD" -alias "$COFRE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | xargs)"
          EXPECTED_SHA1="E5:B3:AF:C6:24:7D:6C:7B:2B:C1:1D:2F:89:B1:27:D1:C4:63:62:9B"
          echo "SHA-1 da assinatura: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || { echo "A keystore não corresponde ao SHA-1 registado no Firebase."; exit 1; }

      - name: Gerar o Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK release assinado
        env:
          COFRE_KEYSTORE_PATH: ${{ github.workspace }}/app/cofre-release.jks
          COFRE_STORE_PASSWORD: ${{ secrets.COFRE_STORE_PASSWORD }}
          COFRE_KEY_ALIAS: ${{ secrets.COFRE_KEY_ALIAS }}
          COFRE_KEY_PASSWORD: ${{ secrets.COFRE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verificar assinatura do APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Cofre-release.apk

      - name: Publicar APK para descarregar
        uses: actions/upload-artifact@v4
        with:
          name: Cofre-APK-release
          path: Cofre-release.apk
          if-no-files-found: error
