plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseStorePath = System.getenv('COFRE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('COFRE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('COFRE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('COFRE_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.cofre.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cofre.app"
        minSdk 23
        targetSdk 34
        versionCode 28
        versionName "1.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
}
